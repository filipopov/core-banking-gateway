# Header-based routing to several gateway releases running side by side.
#
# Every mobile/web client release is built and tested against one gateway release and sends that release in the
# X-Api-Version header. Nginx routes the request to exactly that release, so a client that shipped months ago keeps
# talking to the code it was tested against, while new clients get the newest gateway.
#
# Retiring a release = removing its line from the map once its client release is no longer supported.
# Illustrative example: hostnames and release names are placeholders.

upstream gateway_2026_09 { server gateway-2026-09:8080; keepalive 16; }
upstream gateway_2026_10 { server gateway-2026-10:8080; keepalive 16; }
upstream gateway_2026_11 { server gateway-2026-11:8080; keepalive 16; }

# X-Api-Version -> upstream. No header means "latest"; an unknown value is rejected instead of silently routed.
map $http_x_api_version $gateway_upstream {
    ""          gateway_2026_11;
    "2026.09"   gateway_2026_09;
    "2026.10"   gateway_2026_10;
    "2026.11"   gateway_2026_11;
    default     unsupported;
}

server {
    listen 80;

    location /api/ {
        if ($gateway_upstream = unsupported) {
            default_type application/problem+json;
            return 400 '{"type":"https://github.com/filipopov/core-banking-gateway/blob/main/docs/problems.md#unsupported-api-version","title":"Unsupported API version","status":400,"code":"unsupported-api-version","detail":"X-Api-Version is not served by this deployment"}';
        }

        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tell clients (and logs) which release actually served them.
        add_header X-Gateway-Release $gateway_upstream always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
